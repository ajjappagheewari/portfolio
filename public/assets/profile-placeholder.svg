<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#8B5E3C"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38291A"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#221810"/>
      <stop offset="60%" stop-color="#140E0A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" rx="24" fill="url(#cardBg)"/>

  <!-- Subtle Architectural Luxury Lines -->
  <circle cx="300" cy="280" r="180" fill="url(#goldGlow)"/>
  <circle cx="300" cy="280" r="170" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <circle cx="300" cy="280" r="140" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="300" cy="280" r="100" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Geometric Corner Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <path d="M 560 70 L 560 40 L 530 40" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <path d="M 40 630 L 40 660 L 70 660" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>
  <path d="M 560 630 L 560 660 L 530 660" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Stylized Silhouette Avatar -->
  <g transform="translate(0, 30)">
    <!-- Head / Hair -->
    <path d="M 300 150 C 240 150 215 195 215 255 C 215 315 245 350 300 350 C 355 350 385 315 385 255 C 385 195 360 150 300 150 Z" fill="url(#silhouetteGrad)"/>
    <!-- Face Contour Hint -->
    <path d="M 235 255 C 235 320 265 355 300 355 C 335 355 365 320 365 255 C 365 245 360 230 355 220 C 320 235 280 235 245 220 C 240 230 235 245 235 255 Z" fill="#2E2015" fill-opacity="0.4"/>
    
    <!-- Neck -->
    <path d="M 270 335 L 270 380 L 330 380 L 330 335 Z" fill="#24170E"/>
    
    <!-- Shoulders & Suit / Blazer -->
    <path d="M 150 540 C 160 430 215 385 270 375 L 300 450 L 330 375 C 385 385 440 430 450 540 Z" fill="url(#silhouetteGrad)"/>
    <!-- Collar & Lapels -->
    <path d="M 270 375 L 300 450 L 255 490 L 225 430 Z" fill="#4A3725"/>
    <path d="M 330 375 L 300 450 L 345 490 L 375 430 Z" fill="#4A3725"/>
    <path d="M 285 380 L 300 420 L 315 380 Z" fill="#F5F0E6" fill-opacity="0.1"/>
  </g>

  <!-- Golden Brand Plaque / Label -->
  <g transform="translate(150, 580)">
    <rect width="300" height="64" rx="12" fill="#17110C" stroke="url(#goldBorder)" stroke-width="1.5"/>
    <text x="150" y="28" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#F5F0E6" text-anchor="middle" letter-spacing="2">AJJAPPA GHEEWARI</text>
    <text x="150" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#D4AF37" text-anchor="middle" letter-spacing="3">BCA CANDIDATE</text>
  </g>

  <!-- Golden Monogram Seal -->
  <circle cx="300" cy="110" r="28" fill="#17110C" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <text x="300" y="116" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1">AG</text>
</svg>
