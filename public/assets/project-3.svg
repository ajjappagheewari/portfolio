<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140F0A"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </linearGradient>
    <linearGradient id="p3Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5C542"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#p3Bg)"/>

  <!-- E-commerce Storeframe -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#18120C" stroke="rgba(212,175,55,0.25)" stroke-width="1.5"/>
    
    <!-- Top header with search & cart -->
    <rect width="680" height="50" rx="16" fill="#201710"/>
    <rect y="40" width="680" height="10" fill="#201710"/>
    <text x="30" y="32" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="url(#p3Gold)">AURA CART</text>
    <rect x="220" y="14" width="280" height="24" rx="12" fill="#0E0A08" stroke="rgba(212,175,55,0.2)" stroke-width="1"/>
    <text x="240" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#8B5E3C">Search catalog, electronics, essentials...</text>
    
    <!-- Cart Pill -->
    <rect x="560" y="12" width="95" height="28" rx="14" fill="url(#p3Gold)"/>
    <text x="607" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A0A0A" text-anchor="middle">Cart (3)</text>

    <!-- Product Grid -->
    <!-- Card 1 -->
    <g transform="translate(30, 75)">
      <rect width="195" height="305" rx="12" fill="#120D09" stroke="rgba(212,175,55,0.18)" stroke-width="1"/>
      <rect x="15" y="15" width="165" height="135" rx="8" fill="#1F1710"/>
      <circle cx="97" cy="82" r="35" fill="none" stroke="url(#p3Gold)" stroke-width="3"/>
      <text x="97" y="88" font-family="'Inter', sans-serif" font-size="18" fill="#D4AF37" text-anchor="middle">🎧</text>
      <text x="15" y="180" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F5F0E6">Studio Acoustic Pro</text>
      <text x="15" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#B8AE9C">Wireless ANC Series</text>
      <text x="15" y="240" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="url(#p3Gold)">$249.00</text>
      <rect x="15" y="258" width="165" height="32" rx="6" fill="#2B1D12" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
      <text x="97" y="278" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">+ Add to Cart</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(242, 75)">
      <rect width="195" height="305" rx="12" fill="#120D09" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
      <rect x="15" y="15" width="165" height="135" rx="8" fill="#241B12"/>
      <rect x="25" y="25" width="60" height="18" rx="9" fill="url(#p3Gold)"/>
      <text x="55" y="37" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0A0A0A" text-anchor="middle">POPULAR</text>
      <circle cx="97" cy="82" r="35" fill="none" stroke="url(#p3Gold)" stroke-width="3"/>
      <text x="97" y="88" font-family="'Inter', sans-serif" font-size="18" fill="#D4AF37" text-anchor="middle">⌚</text>
      <text x="15" y="180" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F5F0E6">Chronos Gold Watch</text>
      <text x="15" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#B8AE9C">Sapphire Crystal Glass</text>
      <text x="15" y="240" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="url(#p3Gold)">$399.00</text>
      <rect x="15" y="258" width="165" height="32" rx="6" fill="url(#p3Gold)"/>
      <text x="97" y="278" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A0A0A" text-anchor="middle">Added to Cart ✓</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(455, 75)">
      <rect width="195" height="305" rx="12" fill="#120D09" stroke="rgba(212,175,55,0.18)" stroke-width="1"/>
      <rect x="15" y="15" width="165" height="135" rx="8" fill="#1F1710"/>
      <circle cx="97" cy="82" r="35" fill="none" stroke="url(#p3Gold)" stroke-width="3"/>
      <text x="97" y="88" font-family="'Inter', sans-serif" font-size="18" fill="#D4AF37" text-anchor="middle">💻</text>
      <text x="15" y="180" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F5F0E6">Ultra Thin Laptop</text>
      <text x="15" y="202" font-family="'Inter', sans-serif" font-size="11" fill="#B8AE9C">OLED Display Edition</text>
      <text x="15" y="240" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="url(#p3Gold)">$1,199.00</text>
      <rect x="15" y="258" width="165" height="32" rx="6" fill="#2B1D12" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
      <text x="97" y="278" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">+ Add to Cart</text>
    </g>
  </g>
</svg>
